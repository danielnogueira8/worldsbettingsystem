[project]
name = "worlds-betting"
version = "0.1.0"
description = "Model-driven mispricing finder for Polymarket LoL Worlds 2026 markets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "typer>=0.12",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
wbs = "app.cli:main"

[tool.vercel]
entrypoint = "app.api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
