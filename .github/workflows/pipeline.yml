name: Pipeline

# Runs the data pipeline against the production database (repository secret
# DATABASE_URL). `tick` every 10 minutes; `bootstrap` on demand to load match data.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "bootstrap loads match data and runs everything once; tick is one scheduler cycle"
        type: choice
        options: [tick, bootstrap]
        default: tick

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check for the database secret
        id: secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Repository secret DATABASE_URL is not set; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secret.outputs.ok == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        if: steps.secret.outputs.ok == 'true'
        run: uv venv && uv pip install -e .
      - name: Run ${{ inputs.task || 'tick' }}
        if: steps.secret.outputs.ok == 'true'
        run: .venv/bin/wbs ${{ inputs.task || 'tick' }}
